<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Pokédex</h1>

    <div class="search">
        <input
            type="text"
            id="pokemonName"
            placeholder="Nome ou número do Pokémon">
        <button onclick="buscarPokemon()">
            Buscar
        </button>
    </div>

    <div class="card" id="card">

        <img id="pokemonImage">

        <h2 id="pokemonNome"></h2>

        <p id="pokemonNumero"></p>

        <div id="tipos"></div>

        <div class="info">
            <p id="altura"></p>
            <p id="peso"></p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
